<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Painel da Cozinha — Player</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300..800&family=Space+Grotesk:wght@400..700&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --bg-surface: #f8f9fb;
      --bg-card: #ffffff;
      --bg-subtle: #f3f4f6;
      --bg-pill: #e7e8ea;
      --bg-pill-strong: #e1e2e4;
      --bg-hero: #1b1b1e;
      --text-hero: #ffffff;
      --text-hero-muted: #9a989d;
      --text-primary: #191c1e;
      --text-secondary: #5d5e66;
      --text-muted: #77767b;
      --accent: #000000;
      --on-accent: #ffffff;
      --card-border: rgba(0, 0, 0, 0.04);
      --hero-border: rgba(255, 255, 255, 0.04);
      --ring-track: #323338;
      --ring-fill: #ffffff;
    }

    html.dark {
      --bg-surface: #141416;
      --bg-card: #1f1f22;
      --bg-subtle: #28282c;
      --bg-pill: #2c2c30;
      --bg-pill-strong: #36363b;
      --bg-hero: #26262a;
      --text-hero: #f5f5f7;
      --text-hero-muted: #98989f;
      --text-primary: #f5f5f7;
      --text-secondary: #a1a1a8;
      --text-muted: #7a7a82;
      --accent: #f5f5f7;
      --on-accent: #141416;
      --card-border: rgba(255, 255, 255, 0.07);
      --hero-border: rgba(255, 255, 255, 0.09);
      --ring-track: #3a3a40;
      --ring-fill: #f5f5f7;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: var(--bg-surface);
      color: var(--text-primary);
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    ::-webkit-scrollbar { display: none; }

    .surface-card {
      background-color: var(--bg-card);
      border: 1px solid var(--card-border);
      transition: background-color 0.4s ease, border-color 0.4s ease;
    }

    .hero-card {
      background-color: var(--bg-hero);
      color: var(--text-hero);
      border: 1px solid var(--hero-border);
      transition: background-color 0.4s ease, border-color 0.4s ease;
    }

    .active-outline {
      box-shadow: inset 0 0 0 3px var(--accent);
    }

    .slide-fade {
      animation: fadeIn 0.35s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "surface": "var(--bg-surface)",
            "card": "var(--bg-card)",
            "subtle": "var(--bg-subtle)",
            "pill": "var(--bg-pill)",
            "pill-strong": "var(--bg-pill-strong)",
            "hero": "var(--bg-hero)",
            "on-hero": "var(--text-hero)",
            "hero-muted": "var(--text-hero-muted)",
            "ink": "var(--text-primary)",
            "ink-sec": "var(--text-secondary)",
            "ink-muted": "var(--text-muted)",
            "accent": "var(--accent)",
            "on-accent": "var(--on-accent)"
          },
          spacing: {
            "space-xs": "0.75rem",
            "space-sm": "1.25rem",
            "space-md": "2rem",
            "space-lg": "3rem",
            "gutter": "2rem",
            "margin": "3.25rem"
          },
          fontFamily: {
            "body-lg": ["Hanken Grotesk", "sans-serif"],
            "body-xl": ["Hanken Grotesk", "sans-serif"],
            "label-md": ["Hanken Grotesk", "sans-serif"],
            "label-lg": ["Hanken Grotesk", "sans-serif"],
            "headline-md": ["Hanken Grotesk", "sans-serif"],
            "headline-lg": ["Space Grotesk", "sans-serif"],
            "headline-xl": ["Space Grotesk", "sans-serif"],
            "display-lg": ["Space Grotesk", "sans-serif"],
            "display-xl": ["Space Grotesk", "sans-serif"]
          },
          fontSize: {
            "label-md": ["1rem", { lineHeight: "1.375rem", letterSpacing: "0.06em", fontWeight: "500" }],
            "label-lg": ["1.125rem", { lineHeight: "1.5rem", letterSpacing: "0.04em", fontWeight: "600" }],
            "body-lg": ["1.25rem", { lineHeight: "1.875rem", letterSpacing: "0.01em", fontWeight: "400" }],
            "body-xl": ["1.5rem", { lineHeight: "2.25rem", letterSpacing: "0em", fontWeight: "400" }],
            "headline-md": ["1.75rem", { lineHeight: "2.25rem", letterSpacing: "0em", fontWeight: "600" }],
            "headline-lg": ["2.25rem", { lineHeight: "2.75rem", letterSpacing: "-0.01em", fontWeight: "600" }],
            "headline-xl": ["3rem", { lineHeight: "3.5rem", letterSpacing: "-0.02em", fontWeight: "600" }],
            "display-lg": ["3.75rem", { lineHeight: "4.25rem", letterSpacing: "-0.03em", fontWeight: "700" }],
            "display-xl": ["5rem", { lineHeight: "5.5rem", letterSpacing: "-0.04em", fontWeight: "700" }]

  <!-- Firebase Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="./config.js"></script>

<body class="bg-surface font-body-lg text-body-lg text-ink antialiased w-screen h-screen select-none">

  <!-- Palco do Slide Ativo -->
  <main id="stage" class="w-full h-full box-border"></main>

  <!-- Overlay de Alerta Sonoro -->
  <div id="alert-overlay" class="hidden fixed inset-0 z-50 bg-surface p-margin flex flex-col justify-between">
    <div aria-hidden="true" class="opacity-0 pointer-events-none">SPACER</div>

    <div class="hero-card w-full max-w-5xl mx-auto rounded-3xl p-space-lg shadow-2xl relative overflow-hidden flex flex-col justify-between min-h-[460px]">
      <div class="flex items-center justify-between w-full">
        <div class="inline-flex items-center px-4 py-1.5 rounded-full bg-white/10">
          <span class="font-label-md text-label-md uppercase tracking-[0.25em] text-hero-muted">AVISO AGORA</span>
        </div>
        <div class="flex items-center space-x-3">
          <span class="w-2.5 h-2.5 rounded-full bg-on-hero animate-pulse"></span>
          <span class="font-label-md text-label-md uppercase tracking-widest text-hero-muted">EM ANDAMENTO</span>
        </div>
      </div>

      <div class="my-space-md flex flex-col space-y-4">
        <h1 id="alert-title" class="font-display-xl text-display-xl text-on-hero tracking-tight leading-none">Aviso</h1>
        <p id="alert-message" class="font-headline-md text-headline-md text-hero-muted font-normal max-w-3xl leading-snug"></p>
      </div>

      <div class="w-full pt-space-sm flex flex-col space-y-3">
        <div class="flex justify-between items-baseline text-hero-muted">
          <span class="font-label-md text-label-md tracking-wider uppercase">Tempo Restante</span>
          <span id="alert-remaining" class="font-headline-md text-headline-md text-on-hero font-medium tracking-tight">30s restantes</span>
        </div>
        <div class="w-full h-2 bg-white/15 rounded-full overflow-hidden">
          <div id="alert-bar" class="h-full bg-on-hero rounded-full transition-all duration-500 ease-linear" style="width: 100%;"></div>
        </div>
      </div>
    </div>

    <footer class="w-full flex justify-between items-center text-ink-muted pt-space-md">
      <span class="font-label-md text-label-md tracking-widest uppercase">MODO AVISO • TV 32"</span>
      <div class="flex items-center space-x-4">
        <span class="font-label-md text-label-md tracking-widest uppercase">COZINHA</span>
        <span class="opacity-40">•</span>
        <span id="alert-clock" class="font-label-md text-label-md tracking-widest uppercase">--:--</span>
      </div>
    </footer>
  </div>

  <script>
    const DAY_KEYS = ["dom", "seg", "ter", "qua", "qui", "sex", "sab"];

    function getTodayKey() {
      return DAY_KEYS[new Date().getDay()];
    }

    function emptyWeek() {
      return { seg: [], ter: [], qua: [], qui: [], sex: [], sab: [], dom: [] };
    }

    // =========================================================================
    // 1. ESTADO PADRÃO
    // =========================================================================
    const DEFAULT_STATE = {
      playlist: {
        items: [
          { id: "wilson",  type: "planner", target: "wilson",  label: "Planner — Wilson",   duration: 30, enabled: true, order: 0 },
          { id: "rayssa",  type: "planner", target: "rayssa",  label: "Planner — Rayssa",   duration: 30, enabled: true, order: 1 },
          { id: "meninos", type: "kids",                       label: "Rotina dos Meninos", duration: 30, enabled: true, order: 2 },
          { id: "widgets", type: "widgets",                    label: "Relógio e Recado",   duration: 20, enabled: true, order: 3 },
          { id: "fotos",   type: "photos",                     label: "Fotos da Família",   duration: 20, enabled: true, order: 4 }
        ],
        control: { pinnedId: null, paused: false, skipToken: 0, photosRefreshToken: 0 }
      },
      planners: {
        wilson: emptyWeek(),
        rayssa: emptyWeek(),
        meninos: [
          { id: "m1", title: "Escovar os dentes",  subtitle: "Manhã & Noite",           icon: "tooth", status: "feito" },
          { id: "m2", title: "Guardar brinquedos", subtitle: "Quarto e sala arrumados", icon: "toys",  status: "feito" },
          { id: "m3", title: "Hora do banho",      subtitle: "Água morna e pijama",     icon: "bath",  status: "agora" },
          { id: "m4", title: "Hora de dormir",     subtitle: "História e bons sonhos",  icon: "sleep", status: "falta" }
        ]
      },
      memo: {
        text: "Separar a mochila da escola e a garrafinha para amanhã cedo."
      }
    };

    let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    let photos = [];
    let currentPhotoIdx = 0;
    let currentSlideIdx = 0;
    let slideTimer = null;
    let lastSkipToken = 0;
    let lastPhotosRefreshToken = 0;
    let lastAlertId = null;
    let alertInterval = null;
    let lastRenderedDayKey = getTodayKey();
    let weatherData = { temp: "--°", desc: "Atualizando..." };

    // =========================================================================
    // 2. ÍCONES VETORIAIS (Rotina dos Meninos)
    // =========================================================================
    const KIDS_ICONS = {
      tooth: `<svg class="w-12 h-12" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><path d="M4.5 9c0-3.5 2.5-6.5 7.5-6.5s7.5 3 7.5 6.5c0 4-1.5 8.5-3 12.5-1 1-3.5 1-4.5-1-1 2-3.5 2-4.5 1-1.5-4-3-8.5-3-12.5z"></path><path d="M8.5 7.5c1.5 1 5.5 1 7 0"></path><circle cx="12" cy="13" fill="currentColor" r="1"></circle></svg>`,
      toys:  `<svg class="w-12 h-12" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><rect height="8" rx="1.5" width="8" x="3" y="11"></rect><rect height="8" rx="1.5" width="8" x="13" y="11"></rect><rect height="8" rx="1.5" width="8" x="8" y="3"></rect><circle cx="7" cy="15" fill="currentColor" r="1"></circle><circle cx="17" cy="15" fill="currentColor" r="1"></circle><circle cx="12" cy="7" fill="currentColor" r="1"></circle></svg>`,
      bath:  `<svg class="w-12 h-12" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><path d="M4 12h16c.6 0 1 .4 1 1v2a6 6 0 0 1-6 6H9a6 6 0 0 1-6-6v-2c0-.6.4-1 1-1Z"></path><path d="M6 12V5a2 2 0 0 1 2-2h1a2 2 0 0 1 2 2v2"></path><path d="M5 21l1.5-2.5"></path><path d="M19 21l-1.5-2.5"></path></svg>`,
      sleep: `<svg class="w-12 h-12" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path><path d="M19 3v4"></path><path d="M21 5h-4"></path></svg>`,
      book:  `<svg class="w-12 h-12" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>`,
      food:  `<svg class="w-12 h-12" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path><path d="M7 2v20"></path><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path></svg>`,
      star:  `<svg class="w-12 h-12" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>`
    };

    // =========================================================================
    // 3. UTILITÁRIOS
    // =========================================================================
    function esc(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getClockStr() {
      const now = new Date();
      return String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    }

    function getDateStr() {
      const now = new Date();
      const s = now.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function getWeekdayUpper() {
      return new Date().toLocaleDateString("pt-BR", { weekday: "long" }).toUpperCase();
    }

    function updateAllClocks() {
      const time = getClockStr();
      const date = getDateStr();
      document.querySelectorAll("[data-clock]").forEach(el => el.textContent = time);
      document.querySelectorAll("[data-date]").forEach(el => el.textContent = date);
      const alertClock = document.getElementById("alert-clock");
      if (alertClock) alertClock.textContent = time;

      // Se virou a meia-noite, atualiza o slide para puxar as tarefas do novo dia
      const todayKey = getTodayKey();
      if (todayKey !== lastRenderedDayKey) {
        lastRenderedDayKey = todayKey;
        renderCurrentSlide();
      }
    }

    function getPersonTodayTasks(personKey) {
      const raw = state.planners?.[personKey];
      let list = [];
      if (Array.isArray(raw)) {
        list = raw; // compatibilidade com formato antigo
      } else if (raw && typeof raw === "object") {
        const dayData = raw[getTodayKey()];
        list = Array.isArray(dayData) ? dayData : Object.values(dayData || {});
      }
      return list
        .filter(Boolean)
        .sort((a, b) => String(a.time || "99:99").localeCompare(String(b.time || "99:99")));
    }

    // =========================================================================
    // 4. CLIMA AUTOMÁTICO (Open-Meteo)
    // =========================================================================
    const WMO_DESC = {
      0: "Céu limpo", 1: "Poucas nuvens", 2: "Parcialmente nublado", 3: "Nublado",
      45: "Neblina", 48: "Neblina",
      51: "Garoa leve", 53: "Garoa", 55: "Garoa forte",
      61: "Chuva leve", 63: "Chuva moderada", 65: "Chuva forte",
      80: "Pancadas leves", 81: "Pancadas de chuva", 82: "Chuva intensa",
      95: "Trovoada", 96: "Trovoada com chuva", 99: "Tempestade"
    };

    async function fetchWeather() {
      try {
        const lat = window.APP_CONFIG?.weather?.lat ?? -0.8415;
        const lon = window.APP_CONFIG?.weather?.lon ?? -52.5153;
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`;
        const res = await fetch(url);
        const data = await res.json();
        if (data?.current) {
          weatherData.temp = Math.round(data.current.temperature_2m) + "°";
          weatherData.desc = WMO_DESC[data.current.weather_code] || "Tempo estável";
          const tEl = document.getElementById("weather-temp");
          const dEl = document.getElementById("weather-desc");
          if (tEl) tEl.textContent = weatherData.temp;
          if (dEl) dEl.textContent = weatherData.desc;
        }
      } catch (e) {
        console.warn("Erro ao buscar clima:", e);
      }
    }

    // =========================================================================
    // 5. GOOGLE DRIVE — FOTOS DA FAMÍLIA
    // =========================================================================
    async function fetchDrivePhotos() {
      const url = window.APP_CONFIG?.driveScriptUrl;
      if (!url || url.includes("COLE_A_URL")) return;
      try {
        const res = await fetch(url + "?t=" + Date.now());
        const list = await res.json();
        if (Array.isArray(list)) {
          photos = list.filter(item => item && item.url);
          if (currentPhotoIdx >= photos.length) currentPhotoIdx = 0;
        }
      } catch (e) {
        console.warn("Erro ao carregar fotos do Drive:", e);
      }
    }

    // =========================================================================
    // 6. SOM DE ALERTA NÍTIDO (~3,2 segundos — 3 pulsos de sino duplo)
    // =========================================================================
    function playAlertChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === "suspended") ctx.resume();

        const compressor = ctx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-12, ctx.currentTime);
        compressor.ratio.setValueAtTime(6, ctx.currentTime);
        compressor.connect(ctx.destination);

        const master = ctx.createGain();
        master.gain.setValueAtTime(0.85, ctx.currentTime);
        master.connect(compressor);

        const playTone = (freq, startOffset, dur, vol) => {
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();

          osc1.type = "triangle";
          osc1.frequency.setValueAtTime(freq, ctx.currentTime + startOffset);

          // Harmônico sutil uma oitava acima para cortar o ruído da cozinha
          osc2.type = "sine";
          osc2.frequency.setValueAtTime(freq * 2, ctx.currentTime + startOffset);

          const g2 = ctx.createGain();
          g2.gain.setValueAtTime(0.28, ctx.currentTime + startOffset);

          const t0 = ctx.currentTime + startOffset;
          gain.gain.setValueAtTime(0.001, t0);
          gain.gain.linearRampToValueAtTime(vol, t0 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);

          osc1.connect(gain);
          osc2.connect(g2);
          g2.connect(gain);
          gain.connect(master);

          osc1.start(t0);
          osc2.start(t0);
          osc1.stop(t0 + dur + 0.05);
          osc2.stop(t0 + dur + 0.05);
        };

        // 3 ciclos de alerta espaçados (~3,2s no total)
        [0.0, 1.05, 2.1].forEach(cycle => {
          playTone(783.99, cycle,        0.38, 0.85); // Sol 5
          playTone(1046.5, cycle + 0.24, 0.72, 0.95); // Dó 6
        });

        setTimeout(() => { try { ctx.close(); } catch (_) {} }, 3800);
      } catch (e) {
        console.warn("Áudio bloqueado pelo navegador:", e);
      }
    }

    function handleAlertUpdate(alertObj) {
      const overlay = document.getElementById("alert-overlay");
      if (!alertObj || !alertObj.id || !alertObj.triggeredAt) {
        clearInterval(alertInterval);
        overlay.classList.add("hidden");
        return;
      }

      const duration = Math.max(5, Number(alertObj.duration) || 30);
      const elapsedSec = (Date.now() - Number(alertObj.triggeredAt)) / 1000;
      if (elapsedSec >= duration) {
        clearInterval(alertInterval);
        overlay.classList.add("hidden");
        return;
      }

      document.getElementById("alert-title").textContent = alertObj.title || "Aviso";
      document.getElementById("alert-message").textContent = alertObj.message || "";
      overlay.classList.remove("hidden");

      if (alertObj.id !== lastAlertId) {
        lastAlertId = alertObj.id;
        playAlertChime();
      }

      clearInterval(alertInterval);
      const tick = () => {
        const nowElapsed = (Date.now() - Number(alertObj.triggeredAt)) / 1000;
        const remaining = Math.max(0, Math.ceil(duration - nowElapsed));
        const pct = Math.max(0, Math.min(100, ((duration - nowElapsed) / duration) * 100));
        document.getElementById("alert-bar").style.width = pct + "%";
        document.getElementById("alert-remaining").textContent =
          remaining >= 60
            ? `${Math.ceil(remaining / 60)} min restantes`
            : `${remaining}s restantes`;

        if (remaining <= 0) {
          clearInterval(alertInterval);
          overlay.classList.add("hidden");
        }
      };
      tick();
      alertInterval = setInterval(tick, 500);
    }

    // =========================================================================
    // 7. RENDERIZADORES DE CADA SLIDE
    // =========================================================================
    function renderPlannerSlide(personKey, displayName) {
      const list = getPersonTodayTasks(personKey);
      const doneCount = list.filter(t => t.status === "feito").length;

      const cardsHtml = list.slice(0, 6).map(item => {
        const isNow = item.status === "agora";
        const isDone = item.status === "feito";
        const badgeText = isNow ? "Agora" : (isDone ? "Feito" : "Pendente");
        const badgeClass = isNow
          ? "bg-accent text-on-accent"
          : "bg-pill text-ink";
        const cardClass = isNow
          ? "shadow-md active-outline"
          : (isDone ? "shadow-sm opacity-65" : "shadow-sm");

        return `
          <article class="surface-card rounded-2xl p-6 lg:p-7 flex items-center justify-between min-h-[7rem] ${cardClass}">
            <div class="flex flex-col pr-4 min-w-0">
              <h2 class="font-headline-lg text-headline-lg text-ink truncate leading-tight">${esc(item.title)}</h2>
              <p class="font-body-lg text-body-lg text-ink-sec truncate mt-1">${esc(item.category || "Rotina")}</p>
            </div>
            <div class="flex flex-col items-end shrink-0 space-y-2">
              <span class="font-headline-lg text-headline-lg text-ink tracking-tight">${esc(item.time || "--:--")}</span>
              <span class="${badgeClass} font-label-md text-label-md px-4 py-1.5 rounded-full uppercase tracking-wider font-semibold">${badgeText}</span>
            </div>
          </article>
        `;
      }).join("");

      const emptyHtml = `
        <div class="col-span-2 surface-card rounded-2xl p-12 text-center shadow-sm">
          <p class="font-headline-lg text-headline-lg text-ink-sec">Nenhuma atividade planejada para hoje.</p>
        </div>
      `;

      return `
        <div class="w-full h-full p-margin box-border flex flex-col justify-between slide-fade">
          <section class="hero-card w-full rounded-3xl p-8 lg:p-10 shadow-xl flex items-center justify-between">
            <div class="flex flex-col justify-center space-y-1">
              <span class="font-label-md text-label-md text-hero-muted tracking-widest uppercase">ROTINA DO DIA</span>
              <h1 class="font-display-xl text-display-xl text-on-hero tracking-tight">${esc(displayName)}</h1>
            </div>
            <div class="flex flex-col items-end justify-center text-right space-y-1">
              <span data-date class="font-headline-md text-headline-md text-hero-muted font-normal">${getDateStr()}</span>
              <div data-clock class="font-display-xl text-display-xl text-on-hero tracking-tight font-bold">${getClockStr()}</div>
            </div>
          </section>

          <section class="w-full grid grid-cols-2 gap-gutter my-auto pt-4">
            ${list.length ? cardsHtml : emptyHtml}
          </section>

          <footer class="w-full flex items-center justify-between pt-3 text-ink-sec font-label-md text-label-md">
            <div class="flex items-center space-x-6">
              <span>Concluídas: ${doneCount} de ${list.length}</span>
              <span>•</span>
              <span>Total planejado: ${list.length} atividades</span>
            </div>
            <div class="tracking-widest uppercase">TV Cozinha • Exibição Contínua</div>
          </footer>
        </div>
      `;
    }

    function renderKidsSlide() {
      const list = Array.isArray(state.planners?.meninos)
        ? state.planners.meninos
        : Object.values(state.planners?.meninos || {});

      const total = list.length || 1;
      const done = list.filter(m => m.status === "feito").length;
      const pct = Math.round((done / total) * 100);
      const circ = 188.5;
      const offset = circ - (circ * pct) / 100;

      const cardsHtml = list.slice(0, 4).map(m => {
        const iconSvg = KIDS_ICONS[m.icon] || KIDS_ICONS.star;

        if (m.status === "agora") {
          return `
            <div class="surface-card active-outline rounded-[1.75rem] p-7 shadow-lg flex items-center justify-between relative">
              <div class="flex items-center gap-6 min-w-0">
                <div class="w-20 h-20 rounded-2xl bg-accent text-on-accent flex items-center justify-center shrink-0 shadow-md">${iconSvg}</div>
                <div class="flex flex-col min-w-0">
                  <div class="flex items-center gap-3">
                    <h2 class="font-headline-lg text-headline-lg text-ink truncate">${esc(m.title)}</h2>
                    <span class="w-2.5 h-2.5 rounded-full bg-accent animate-ping"></span>
                  </div>
                  <p class="font-body-xl text-body-xl text-ink-sec truncate mt-0.5">${esc(m.subtitle || "")}</p>
                </div>
              </div>
              <div class="shrink-0 flex items-center gap-3 px-7 py-3 rounded-full bg-accent text-on-accent shadow-md">
                <span class="w-2 h-2 rounded-full bg-on-accent"></span>
                <span class="font-label-lg text-label-lg uppercase tracking-widest font-bold">AGORA</span>
              </div>
            </div>
          `;
        }

        if (m.status === "feito") {
          return `
            <div class="surface-card rounded-[1.75rem] p-7 shadow-sm flex items-center justify-between">
              <div class="flex items-center gap-6 min-w-0">
                <div class="w-20 h-20 rounded-2xl bg-subtle text-ink flex items-center justify-center shrink-0">${iconSvg}</div>
                <div class="flex flex-col min-w-0">
                  <h2 class="font-headline-lg text-headline-lg text-ink truncate">${esc(m.title)}</h2>
                  <p class="font-body-xl text-body-xl text-ink-sec truncate mt-0.5">${esc(m.subtitle || "")}</p>
                </div>
              </div>
              <div class="shrink-0 flex items-center gap-2.5 px-6 py-3 rounded-full bg-pill text-ink">
                <svg class="w-6 h-6 text-ink" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                <span class="font-label-lg text-label-lg uppercase tracking-wider font-bold">FEITO</span>
              </div>
            </div>
          `;
        }

        return `
          <div class="surface-card rounded-[1.75rem] p-7 shadow-sm opacity-80 flex items-center justify-between">
            <div class="flex items-center gap-6 min-w-0">
              <div class="w-20 h-20 rounded-2xl bg-subtle text-ink-sec flex items-center justify-center shrink-0">${iconSvg}</div>
              <div class="flex flex-col min-w-0">
                <h2 class="font-headline-lg text-headline-lg text-ink-sec truncate">${esc(m.title)}</h2>
                <p class="font-body-xl text-body-xl text-ink-muted truncate mt-0.5">${esc(m.subtitle || "")}</p>
              </div>
            </div>
            <div class="shrink-0 px-7 py-3 rounded-full bg-subtle text-ink-sec">
              <span class="font-label-lg text-label-lg uppercase tracking-wider font-semibold">FALTA</span>
            </div>
          </div>
        `;
      }).join("");

      return `
        <div class="w-full h-full p-margin box-border flex flex-col justify-between slide-fade">
          <section class="hero-card rounded-[1.75rem] px-10 py-7 shadow-xl flex items-center justify-between">
            <div class="flex flex-col gap-1">
              <div class="flex items-center gap-3">
                <span class="font-label-md text-label-md uppercase tracking-[0.2em] text-hero-muted">MISSÕES DE HOJE</span>
                <span class="w-2 h-2 rounded-full bg-white/30"></span>
                <span class="font-label-md text-label-md uppercase tracking-wider text-hero-muted">${getWeekdayUpper()}</span>
              </div>
              <h1 class="font-display-lg text-display-lg text-on-hero tracking-tight leading-none mt-1">Rotina dos Meninos</h1>
            </div>

            <div class="flex items-center gap-8 pl-8 border-l border-white/15">
              <div class="flex flex-col items-end">
                <span class="font-display-xl text-display-xl leading-none text-on-hero">
                  ${done}<span class="font-headline-lg text-hero-muted mx-2">de</span>${list.length}
                </span>
                <span class="font-label-lg text-label-lg uppercase tracking-wider text-hero-muted mt-1">completadas</span>
              </div>
              <div class="relative w-20 h-20 flex items-center justify-center">
                <svg class="w-full h-full -rotate-90" viewBox="0 0 72 72">
                  <circle cx="36" cy="36" fill="none" r="30" stroke="var(--ring-track)" stroke-width="7"></circle>
                  <circle cx="36" cy="36" fill="none" r="30" stroke="var(--ring-fill)" stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round" stroke-width="7"></circle>
                </svg>
                <span class="absolute font-headline-md text-label-lg text-on-hero">${pct}%</span>
              </div>
            </div>
          </section>

          <section class="grid grid-cols-2 gap-7 my-auto">${cardsHtml}</section>

          <footer class="flex items-center justify-between pt-2 text-ink-muted">
            <div class="flex items-center gap-3">
              <span class="w-2.5 h-2.5 rounded-full bg-pill-strong"></span>
              <p class="font-label-md text-label-md tracking-widest uppercase">MODO INFANTIL • TV COZINHA • EXIBIÇÃO CONTÍNUA</p>
            </div>
            <div class="flex items-center gap-4">
              <span data-clock class="font-label-lg text-label-lg text-ink">${getClockStr()}</span>
              <span class="font-label-md text-label-md tracking-wider uppercase opacity-70">• ATUALIZADO AGORA</span>
            </div>
          </footer>
        </div>
      `;
    }

    function renderWidgetsSlide() {
      const memoText = state.memo?.text || "Tudo em ordem por aqui.";
      return `
        <div class="w-full h-full p-margin box-border flex flex-col justify-between slide-fade">
          <section class="hero-card w-full rounded-[2rem] p-space-lg shadow-xl">
            <div class="flex flex-row items-end justify-between">
              <div class="flex flex-col gap-2">
                <span class="font-label-md text-label-md uppercase tracking-[0.2em] text-hero-muted">Horário Local</span>
                <div data-clock class="font-display-xl text-[6rem] leading-[5.75rem] tracking-[-0.04em] font-bold text-on-hero">${getClockStr()}</div>
                <div data-date class="font-body-xl text-body-xl text-hero-muted font-light tracking-wide mt-2">${getDateStr()}</div>
              </div>
              <div class="flex flex-col items-end text-right gap-2">
                <span class="font-label-md text-label-md uppercase tracking-[0.2em] text-hero-muted">Temperatura Externa</span>
                <div id="weather-temp" class="font-display-xl text-[5.5rem] leading-[5.25rem] tracking-[-0.03em] font-bold text-on-hero">${esc(weatherData.temp)}</div>
                <div id="weather-desc" class="font-body-xl text-body-xl text-hero-muted font-light tracking-wide mt-2">${esc(weatherData.desc)}</div>
              </div>
            </div>
          </section>

          <section class="surface-card w-full text-ink rounded-[2rem] p-space-lg shadow-sm my-auto">
            <div class="flex flex-col items-start gap-4">
              <div class="bg-pill-strong px-4 py-1.5 rounded-full">
                <span class="font-label-md text-label-md uppercase tracking-[0.25em] text-ink-sec font-semibold">Recado da Casa</span>
              </div>
              <p class="font-headline-xl text-headline-xl text-ink font-semibold leading-[1.25] tracking-tight max-w-5xl pt-2">
                ${esc(memoText)}
              </p>
            </div>
          </section>

          <footer class="w-full flex flex-row items-center justify-between text-ink-sec pt-2">
            <div class="flex items-center gap-3">
              <span class="w-2 h-2 rounded-full bg-ink-muted"></span>
              <span class="font-label-md text-label-md uppercase tracking-[0.15em]">Modo Ambiente • TV Cozinha</span>
            </div>
            <span class="font-label-md text-label-md uppercase tracking-[0.15em]">Laranjal do Jari</span>
          </footer>
        </div>
      `;
    }

    function renderPhotosSlide() {
      if (!photos.length) {
        return `
          <div class="w-full h-full p-margin box-border flex items-center justify-center slide-fade">
            <div class="hero-card rounded-3xl p-space-lg text-center max-w-2xl shadow-xl">
              <span class="font-label-md text-label-md uppercase tracking-[0.25em] text-hero-muted">FOTOS DA FAMÍLIA</span>
              <h1 class="font-headline-xl text-headline-xl mt-3">Pasta do Drive vazia</h1>
              <p class="font-body-xl text-body-xl text-hero-muted mt-2">Adicione imagens na pasta compartilhada para exibir aqui.</p>
            </div>
          </div>
        `;
      }

      const photo = photos[currentPhotoIdx % photos.length];
      currentPhotoIdx = (currentPhotoIdx + 1) % photos.length;

      return `
        <div class="w-full h-full bg-[#141416] relative flex items-center justify-center overflow-hidden slide-fade">
          <img src="${esc(photo.url)}" alt="" class="w-full h-full object-contain"/>
        </div>
      `;
    }

    function renderStandbySlide() {
      return `
        <div class="w-full h-full bg-[#141416] text-[#f5f5f7] flex flex-col items-center justify-center slide-fade">
          <div data-clock class="font-display-xl text-[7.5rem] leading-none tracking-tight font-bold">${getClockStr()}</div>
          <div data-date class="font-headline-md text-headline-md text-[#98989f] mt-4 font-normal">${getDateStr()}</div>
        </div>
      `;
    }

    // =========================================================================
    // 8. MOTOR DA PLAYLIST
    // =========================================================================
    function getActivePlaylist() {
      const raw = state.playlist?.items || [];
      const arr = Array.isArray(raw) ? raw : Object.values(raw);
      return arr
        .filter(item => item && item.enabled)
        .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    }

    function renderCurrentSlide() {
      clearTimeout(slideTimer);
      lastRenderedDayKey = getTodayKey();
      const stage = document.getElementById("stage");
      const control = state.playlist?.control || {};
      const activeList = getActivePlaylist();

      if (!activeList.length && !control.pinnedId) {
        stage.innerHTML = renderStandbySlide();
        return;
      }

      let slide = null;
      if (control.pinnedId) {
        const allRaw = state.playlist?.items || [];
        const all = Array.isArray(allRaw) ? allRaw : Object.values(allRaw);
        slide = all.find(s => s && s.id === control.pinnedId) || activeList[0];
      } else {
        if (currentSlideIdx >= activeList.length) currentSlideIdx = 0;
        slide = activeList[currentSlideIdx];
      }

      if (!slide) {
        stage.innerHTML = renderStandbySlide();
        return;
      }

      if (slide.type === "planner") {
        const displayName = slide.target === "rayssa" ? "Rayssa" : "Wilson";
        stage.innerHTML = renderPlannerSlide(slide.target, displayName);
      } else if (slide.type === "kids") {
        stage.innerHTML = renderKidsSlide();
      } else if (slide.type === "widgets") {
        stage.innerHTML = renderWidgetsSlide();
      } else if (slide.type === "photos") {
        stage.innerHTML = renderPhotosSlide();
      } else {
        stage.innerHTML = renderStandbySlide();
      }

      if (!control.pinnedId && !control.paused && activeList.length > 1) {
        const ms = Math.max(5, Number(slide.duration) || 20) * 1000;
        slideTimer = setTimeout(() => {
          currentSlideIdx = (currentSlideIdx + 1) % activeList.length;
          renderCurrentSlide();
        }, ms);
      } else if (slide.type === "photos" && !control.paused && photos.length > 1) {
        const ms = Math.max(5, Number(slide.duration) || 20) * 1000;
        slideTimer = setTimeout(() => renderCurrentSlide(), ms);
      }
    }

    // =========================================================================
    // 9. INICIALIZAÇÃO DO FIREBASE (Somente Leitura)
    // =========================================================================
    function initFirebase() {
      const cfg = window.APP_CONFIG?.firebase;
      if (!cfg || !cfg.databaseURL) {
        renderCurrentSlide();
        return;
      }

      firebase.initializeApp(cfg);
      const db = firebase.database();

      // Tema sincronizado (Claro / Escuro Apple)
      db.ref("settings/theme").on("value", snap => {
        const theme = snap.val();
        document.documentElement.classList.toggle("dark", theme === "dark");
      });

      db.ref("playlist").on("value", snap => {
        const val = snap.val();
        if (val) {
          if (val.items) state.playlist.items = val.items;
          const ctrl = val.control || {};
          state.playlist.control = {
            pinnedId: ctrl.pinnedId || null,
            paused: Boolean(ctrl.paused),
            skipToken: ctrl.skipToken || 0,
            photosRefreshToken: ctrl.photosRefreshToken || 0
          };

          if (ctrl.skipToken && ctrl.skipToken !== lastSkipToken) {
            lastSkipToken = ctrl.skipToken;
            const active = getActivePlaylist();
            if (active.length) currentSlideIdx = (currentSlideIdx + 1) % active.length;
          }
          if (ctrl.photosRefreshToken && ctrl.photosRefreshToken !== lastPhotosRefreshToken) {
            lastPhotosRefreshToken = ctrl.photosRefreshToken;
            fetchDrivePhotos();
          }
          renderCurrentSlide();
        }
      });

      db.ref("planners").on("value", snap => {
        const val = snap.val();
        if (val) {
          state.planners = { ...state.planners, ...val };
          renderCurrentSlide();
        }
      });

      db.ref("memo").on("value", snap => {
        const val = snap.val();
        if (val) {
          state.memo = val;
          renderCurrentSlide();
        }
      });

      db.ref("alert").on("value", snap => {
        handleAlertUpdate(snap.val());
      });
    }

    // Boot
    fetchWeather();
    fetchDrivePhotos();
    setInterval(updateAllClocks, 10000);
    setInterval(fetchWeather, 30 * 60 * 1000);
    setInterval(fetchDrivePhotos, 15 * 60 * 1000);
    renderCurrentSlide();
    initFirebase();
  </script>
</body>
</html>
